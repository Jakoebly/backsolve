name: backsolve
description: Mental math for case interviews
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none'

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# In Android, build-name is used as versionName while build-number used as versionCode.
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # Presentation (research.md R-02)
  flutter_riverpod: ^3.0.0
  go_router: ^16.0.0
  fl_chart: ^1.0.0

  # Data layer — local SQLite via Drift (Constitution II)
  drift: ^2.28.0
  drift_flutter: ^0.3.0

  # Pure-Dart domain package (Constitution I)
  backsolve_domain:
    path: packages/backsolve_domain

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Drift code generation — the only build_runner consumer (Constitution VII)
  drift_dev: ^2.28.0
  build_runner: ^2.4.0

  # Brand asset generation — run only through tool/generate_brand_assets.dart
  # (it builds the launch tile and repairs iOS files the tools rewrite).
  # Dev-only; none adds Android/iOS code to the app (Constitution VII, research R-01).
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  image: ^4.10.1 # rounded launch tile (R-12); already resolved by both tools

# Launcher icons from assets/brand/ (masters are NOT listed under flutter: assets).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/brand/backsolve_icon_1024.png"
  remove_alpha_ios: true
  min_sdk_android: 24
  adaptive_icon_background: "#007B82"
  adaptive_icon_foreground: "assets/brand/backsolve_glyph_1024.png"
  adaptive_icon_foreground_inset: 16

# Launch screens: the rounded app-icon tile on #034A4A. The tile image is built
# by the wrapper into build/ (gitignored) right before this runs. No *_dark keys
# (dark falls back to these values) and no icon_background_color (R-04).
flutter_native_splash:
  color: "#034A4A"
  image: build/brand/launch_tile.png
  android_12:
    image: build/brand/launch_tile.png
  web: false

# The following section is specific to Flutter packages.
flutter:
  # Ensures the Material Icons font is bundled (the screens use Icons.*).
  uses-material-design: true
