name: backsolve
description: Mental math for case interviews
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none'

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# In Android, build-name is used as versionName while build-number used as versionCode.
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # Presentation (research.md R-02)
  flutter_riverpod: ^3.0.0
  go_router: ^16.0.0
  fl_chart: ^1.0.0

  # Data layer — local SQLite via Drift (Constitution II)
  drift: ^2.28.0
  drift_flutter: ^0.3.0

  # Pure-Dart domain package (Constitution I)
  backsolve_domain:
    path: packages/backsolve_domain

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Drift code generation — the only build_runner consumer (Constitution VII)
  drift_dev: ^2.28.0
  build_runner: ^2.4.0

# The following section is specific to Flutter packages.
flutter:
  # Ensures the Material Icons font is bundled (the screens use Icons.*).
  uses-material-design: true
